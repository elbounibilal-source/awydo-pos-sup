<title>Awydo — نقطة بيع الجملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* VOICE: a working till — calm, dense, quick to read under shop light
   IDEA: the wholesaler's ruled ledger and printed ticket
   PICTURE: the live sale screen itself, open mid-use
   COLOUR and TYPE: soft low-glare grounds, one calm primary (teal / slate blue / olive, user-chosen), warm amber for highlights; Plex Arabic + Schibsted for figures
   LAYOUT: top status bar, view, fixed bottom nav; cart bar above nav; sheets slide up */
:root{color-scheme:light dark;--bad:light-dark(#b4483c,#e58a7e);--hi:light-dark(#c98232,#e2a55c);--ok:light-dark(#2e7a52,#72c79a);--warn:light-dark(#8f6410,#e3b453);--pl:91%}
:root,:root[data-pal=teal]{--bg:light-dark(#eef1ed,#111816);--panel:light-dark(#fbfcfa,#18211f);--ink:light-dark(#1d2a27,#e3ebe8);--mute:light-dark(#5f6e69,#8fa19b);--line:light-dark(#d8dfda,#28342f);--acc:light-dark(#1f6f68,#56aca1);--hdr:light-dark(#1b5f59,#15302c);--soft:light-dark(#dcebe7,#1d3531)}
:root[data-pal=blue]{--bg:light-dark(#eef1f5,#10151b);--panel:light-dark(#fbfcfd,#18202a);--ink:light-dark(#1c2633,#e3e9f0);--mute:light-dark(#5f6b7a,#8d9aa9);--line:light-dark(#d7dde5,#28323e);--acc:light-dark(#2f6690,#6fa3cf);--hdr:light-dark(#294f70,#18283a);--soft:light-dark(#dde7f1,#1c2c3d)}
:root[data-pal=sand]{--bg:light-dark(#f2f0e8,#15150f);--panel:light-dark(#fcfbf7,#1e1e17);--ink:light-dark(#2a2a21,#ecebe2);--mute:light-dark(#6a685b,#a3a092);--line:light-dark(#dfdcd0,#33322a);--acc:light-dark(#566a35,#a4b878);--hdr:light-dark(#4b5b2f,#2a301e);--soft:light-dark(#e5e9d6,#2b311f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans Arabic","Schibsted Grotesk",system-ui,sans-serif;overflow-x:clip;padding-bottom:150px}
.tkrow .amt,.ticket .l>span.num{direction:ltr;unicode-bidi:isolate}
.num{font-family:"Schibsted Grotesk","IBM Plex Sans Arabic",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select{min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 12px;width:100%}
.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
header{position:sticky;top:0;z-index:5;background:var(--hdr);color:#fff;display:flex;align-items:center;gap:10px;padding:10px max(4vw,14px)}
header h1{font-size:17px;margin:0;flex:1;line-height:1.2}
header small{display:block;font-weight:400;opacity:.7;font-size:13px}
.pill{background:transparent;color:inherit;border-color:#fff4;font-size:13px;min-height:36px;display:flex;align-items:center;gap:6px;padding:0 10px}
.dot{width:9px;height:9px;border-radius:50%;background:#5cc08d}.off .dot{background:#e8a640}.syncing .dot{animation:bl .6s infinite alternate}
@keyframes bl{to{opacity:.2}}@media(prefers-reduced-motion:reduce){.syncing .dot{animation:none}.sheet{transition:none!important}}
main{max-width:1100px;margin:0 auto;padding:14px max(4vw,14px)}
h2{font-size:24px;line-height:1.1;margin:6px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;min-height:38px;font-size:14px;background:transparent}
.seg button.on{background:var(--acc);color:#fff;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips button{flex:none;min-height:36px;font-size:14px;border-radius:99px}
.chips button.on{border-color:var(--acc);background:var(--soft);color:var(--acc);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.prod{text-align:start;padding:10px;display:flex;flex-direction:column;gap:2px;min-height:108px;position:relative}
.prod b{font-size:15px;line-height:1.25}

.prod .q{position:absolute;top:8px;inset-inline-end:8px;z-index:1;background:var(--hi);color:#fff;border-radius:99px;font-size:13px;padding:0 8px;font-weight:700}
.th{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:9px;overflow:hidden;flex:none;vertical-align:middle;background:light-dark(hsl(var(--h) 30% 90%),hsl(var(--h) 16% 22%))}
.th img,.th svg{width:100%;height:100%;object-fit:cover;display:block}.th.s{width:34px;height:34px;border-radius:7px}
.th.big2{width:120px;height:120px;border-radius:14px}

.prod .lw{position:absolute;top:8px;inset-inline-start:8px;background:var(--panel);color:var(--warn);border-radius:99px;font-size:12px;padding:0 8px;font-weight:700;z-index:1}
.grid.list{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.list .prod{flex-direction:row;align-items:center;min-height:64px;gap:10px;padding:8px 10px}
.grid.list .prod .pb{display:flex;flex-direction:column;flex:1}.grid.list .prod .p{font-size:17px;margin:0;color:var(--acc)}
.swatch{display:flex;align-items:center;gap:10px;justify-content:flex-start;width:100%;margin-top:6px}
.swatch i{display:flex;width:56px;height:28px;border-radius:7px;overflow:hidden;flex:none}.swatch i b{flex:1}
.swatch.on{border:2px solid var(--acc);font-weight:700}
.imgbox{display:flex;gap:12px;align-items:center;margin-top:6px}.filebtn{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;font-size:15px;color:var(--ink);margin:0}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
tr.clk{cursor:pointer}
.cartbar{position:fixed;inset-inline:0;bottom:64px;z-index:6;padding:8px max(4vw,14px);background:var(--bg);border-top:1px solid var(--line)}
.cartbar button{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:17px;min-height:52px}
nav{position:fixed;inset-inline:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);height:64px}

nav button.on{color:var(--acc);font-weight:700}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:start;font-size:13px;color:var(--mute);font-weight:500;border-bottom:2px solid var(--acc);padding:6px 4px}
td{border-bottom:1px solid var(--line);padding:9px 4px;vertical-align:middle}
td.r,th.r{text-align:end}
.bad{color:var(--bad);font-weight:700}.good{color:var(--ok);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpi>span{display:block;color:var(--mute);font-size:13px}.kpi b{font-size:clamp(22px,6vw,30px)}
.big{background:var(--acc);color:#fff;border-color:var(--acc)}.big>span{color:inherit;opacity:.7}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:10px}
.bars div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bars div.z{background:var(--line)}
.hrs{display:flex;gap:4px;font-size:12px;color:var(--mute)}.hrs span{flex:1;text-align:center}
.meter{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--acc)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
.scrim{position:fixed;inset:0;background:#0007;z-index:20;display:none}
.scrim.on{display:block}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:21;background:var(--panel);border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:16px max(4vw,16px) 24px;transform:translateY(105%);transition:transform .22s ease;max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.sheet h3{margin:0 0 10px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.line{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.step{display:flex;align-items:center;gap:4px}.step button{width:44px;padding:0;font-size:20px}.step input{width:64px;text-align:center;padding:0}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:700;padding:12px 0}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.ticket{font-family:"Schibsted Grotesk","IBM Plex Sans Arabic",monospace;background:#fff;color:#111;padding:16px;border-radius:6px;border:1px dashed #999;font-size:14px}
.ticket .c{text-align:center}.ticket hr{border:0;border-top:1px dashed #999}
.ticket .l{display:flex;justify-content:space-between;gap:8px}
.toast{position:fixed;top:64px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.full{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;display:none}.full.on{display:block}
.fbar{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;padding:8px max(4vw,14px);background:var(--hdr);color:#fff}
.fbar b{flex:1;font-size:16px}.fbar #fx{background:transparent;color:inherit;border-color:#fff4;width:44px;padding:0}
.fbody{max-width:1100px;margin:0 auto;padding:14px max(4vw,14px) 40px;display:grid;gap:12px}
.dochead{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:2px 14px}
.docno{font-size:22px;display:block;padding-top:6px}
.pt{min-width:700px;font-size:14px}.pt th{background:var(--panel);padding:8px 6px;white-space:nowrap}
.pt td{padding:4px}.pt input,.pt select{min-height:40px;padding:0 8px}
.pt .cq{width:84px;text-align:center}.pt .cc{width:110px}.pt td.idx{color:var(--mute);width:30px;text-align:center}
.pt .pc{position:sticky;inset-inline-start:0;background:var(--panel);z-index:1;min-width:160px;box-shadow:inset -1px 0 0 var(--line)}
.pt tfoot td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700;padding:10px 6px}
.scanbar{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.sugl{display:grid;gap:4px;padding:0 12px}.sugl:not(:empty){padding-bottom:12px}
.sugl button{text-align:start;display:flex;justify-content:space-between;gap:8px}
.tag{font-size:12px;border:1px solid currentColor;border-radius:99px;padding:1px 8px;white-space:nowrap;display:inline-block}
.tag.mute{color:var(--mute)}tr.cx td{color:var(--mute)}tr.cx td b,tr.cx .num{text-decoration:line-through}
.trow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;align-items:center}
@media(max-width:600px){.pt{min-width:0}.pt thead{display:none}.pt,.pt tbody,.pt tfoot{display:block}
.pt tr{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.8fr) minmax(0,1fr) 40px;gap:6px 8px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:end}
.pt td{border:0;padding:0}.pt td.pc{grid-column:1/-1;position:static;box-shadow:none;background:none}.pt td.bc,.pt tfoot td:empty{display:none}
.pt .cq,.pt .cc{width:100%}.pt tbody td:nth-child(3){grid-area:2/1}.pt tbody td:nth-child(4){grid-area:2/2}.pt tbody td:nth-child(5){grid-area:2/3}.pt tbody td:nth-child(9){grid-area:2/4}.pt tbody td:nth-child(6){grid-area:3/1/4/3}.pt td.lt{grid-area:3/3/4/5;text-align:end}.pt td.lu{grid-area:4/1/5/5}
.pt td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--mute);text-align:start;font-weight:400}
.pt tfoot tr{grid-template-columns:1fr 1fr 1fr;border:0;border-top:2px solid var(--ink)}.pt tfoot td{border-top:0;padding:0}.pt tfoot td.pc{grid-column:auto}.pt td.empty{grid-column:1/-1}}
.warn{background:light-dark(#fdf0e0,#3a2a12);color:var(--warn);border-radius:10px;padding:10px;font-size:14px}
[hidden]{display:none!important}.till{display:grid;gap:12px}.tl-l .seg button{white-space:nowrap;padding:0 10px}.tl-r{display:none}
@media(min-width:900px){body.saleview main{max-width:1440px}.till{grid-template-columns:minmax(0,1fr) 400px;align-items:start}.tl-r{display:block;position:sticky;top:68px;height:calc(100vh - 148px)}body.saleview .cartbar{display:none!important}body.saleview{padding-bottom:76px}}
@media(max-width:899px){.kbd{display:none}}
.ibtn{position:relative;width:48px;padding:0;flex:none;display:grid;place-items:center}.ibtn .cnt{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--hi);color:#fff;border-radius:99px;font-size:12px;padding:0 6px;font-weight:700}

.cubtn.on{border-color:var(--acc);background:var(--soft);color:var(--acc)}
.seg button:disabled{opacity:.45}.seg button.on:disabled{opacity:1}
.prod.inc{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.tkp{display:flex;flex-direction:column;height:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.tkr b{display:block;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tkr .meta{font-size:13px;color:var(--mute)}.tkr .lt{font-weight:700}

.kp .kdel{color:var(--bad)}.kp .kadd{grid-column:span 2;font-size:16px;font-family:inherit;background:var(--soft);color:var(--acc);border-color:var(--acc);font-weight:700}
.paybtn{min-height:56px;font-size:18px;display:flex;justify-content:space-between;align-items:center;width:100%}.paybtn:disabled{opacity:.5}.fk{font-size:11px;opacity:.7;border:1px solid #fff8;border-radius:4px;padding:0 4px;font-weight:400}
.tkwrap{height:calc(100dvh - 60px);padding:10px max(3vw,10px)}
.crow{display:flex;flex-direction:column;align-items:flex-start;text-align:start;padding:8px 12px;min-height:52px;gap:2px}.crow.on{border-color:var(--acc);background:var(--soft)}

.grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
.prod.pic .pb{padding:6px 8px 8px}

   save();closeSheet();refreshTill()};
  $("lok").onclick=apply;iv.onkeydown=e=>{if(e.key==="Enter")apply()};

/* ---- v19: profit report by day / month / range ---- */
let RP=null;
function rpRange(k){const d=new Date();const ds=x=>dstr(x.getTime());const T=today();
 if(k==="t")return[T,T];if(k==="y"){const y=new Date(Date.now()-864e5);return[ds(y),ds(y)]}
 if(k==="w"){const x=new Date();const off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);return[ds(x),T]}
 if(k==="m")return[T.slice(0,8)+"01",T];
 if(k==="lm"){const a=new Date(d.getFullYear(),d.getMonth()-1,1),b=new Date(d.getFullYear(),d.getMonth(),0);return[ds(a),ds(b)]}
 if(k==="yr")return[T.slice(0,4)+"-01-01",T];return[RP.from,RP.to]}
function proData(from,to){const inR=x=>x>=from&&x<=to;const days=Math.round((new Date(to)-new Date(from))/864e5)+1;const mon=days>62;const key=d=>mon?d.slice(0,7):d;const B={};
 const g=k=>B[k]||(B[k]={k,rev:0,cost:0,ret:0,retC:0,exp:0,n:0,cred:0,col:0});
 S.sales.forEach(s=>{const d=dstr(s.t);if(!inR(d))return;const b=g(key(d));if(s.pay==="debt"){b.col+=+s.paid||+s.total||0;return}
  b.rev+=s.total;b.cost+=s.items.reduce((a,i)=>a+i.q*(+i.cost||0),0);b.n++;b.cred+=Math.max(0,s.total-(+s.paid||0))});
 S.returns.forEach(r=>{const d=dstr(r.t);if(!inR(d))return;const b=g(key(d));b.ret+=r.total;b.retC+=r.items.reduce((a,i)=>a+i.q*(+i.cost||0),0)});
 S.expenses.forEach(e=>{if(e.status==="cancelled"||!inR(e.d))return;g(key(e.d)).exp+=+e.a||0});
 const rows=Object.values(B).sort((a,b)=>b.k.localeCompare(a.k));rows.forEach(b=>{b.net=b.rev-b.ret;b.gross=b.net-(b.cost-b.retC);b.np=b.gross-b.exp});
 const T=rows.reduce((a,b)=>{["rev","cost","ret","retC","exp","n","cred","col","net","gross","np"].forEach(k=>a[k]+=b[k]);return a},{rev:0,cost:0,ret:0,retC:0,exp:0,n:0,cred:0,col:0,net:0,gross:0,np:0});
 return{rows,T,mon,days}}
function repPro(box){if(!RP)RP={p:"m",from:today().slice(0,8)+"01",to:today()};const[from,to]=rpRange(RP.p);if(RP.p!=="c"){RP.from=from;RP.to=to}
 const D=proData(from,to),T=D.T;const mg=T.net?T.gross/T.net*100:0;const loc=S.lang==="ar"?"ar-MA":"fr-MA";
 const lbl=k=>D.mon?new Date(k+"-01T00:00").toLocaleDateString(loc,{month:"long",year:"numeric"}):new Date(k+"T00:00").toLocaleDateString(loc,{weekday:"short",day:"numeric",month:"short"});
 const ch=D.rows.slice().reverse();const mx=Math.max(1,...ch.map(b=>Math.abs(b.np)),...ch.map(b=>b.net));
 box.innerHTML=`<div class="chips" id="rpp" style="padding-top:0">${[["t","prT"],["y","prY"],["w","prW"],["m","prM"],["lm","prLM"],["yr","prYr"],["c","prC"]].map(([k,n])=>`<button data-k="${k}" class="${RP.p===k?"on":""}">${t(n)}</button>`).join("")}</div>
 <div class="card filt" style="margin-bottom:10px"><div><label for="rp1">${t("from")}</label><input id="rp1" type="date" value="${from}"></div><div><label for="rp2">${t("to")}</label><input id="rp2" type="date" value="${to}"></div></div>
 <div class="kpis pkpis"><div class="card kpi big"><span>${t("netL")}</span><b>${m(T.np)}</b><small>${t("grossL")} ${m(T.gross)} · ${mg.toFixed(1)}%</small></div>
 <div class="card kpi"><span>${t("salesL")}</span><b>${m(T.net)}</b><small class="num">${T.n} ${t("nTickets")} · ${t("avgTk")} ${f2(T.n?T.rev/T.n:0)}</small></div>
 <div class="card kpi"><span>${t("cogsL")}</span><b>${m(T.cost-T.retC)}</b></div>
 <div class="card kpi"><span>${t("expL")}</span><b class="${T.exp?"bad":""}">${m(T.exp)}</b><small>${t("retL")}: ${mT(T.ret)}</small></div>
 <div class="card kpi"><span>${t("credGiven")}</span><b class="${T.cred?"bad":""}">${m(T.cred)}</b><small>${t("collected")}: ${mT(T.col)}</small></div></div>
 ${ch.length>1?`<div class="card"><b>${D.mon?t("byMon"):t("byDay")}</b><div class="pbars">${ch.map(b=>`<div class="pb" title="${esc(b.k)}"><div class="pbv"><i class="r" style="height:${Math.max(0,b.net)/mx*100}%"></i><i class="${b.np<0?"n":"p"}" style="height:${Math.abs(b.np)/mx*100}%"></i></div><small>${D.mon?b.k.slice(5):b.k.slice(8)}</small></div>`).join("")}</div>
 <div class="row note" style="gap:14px;margin-top:6px"><span><i class="lg pr"></i> ${t("salesL")}</span><span><i class="lg pp"></i> ${t("netL")}</span></div></div>`:""}
 <div class="card" style="padding:0"><div class="trow" style="padding:10px 14px"><b>${D.mon?t("byMon"):t("byDay")}</b><button class="xbtn" id="rpx">${IXL} ${t("excel")}</button></div>
 ${D.rows.length?`<div class="plist">${D.rows.map(b=>`<div class="prow"><div class="pd"><b>${esc(lbl(b.k))}</b><small class="num">${b.n} ${t("nTickets")}${b.exp?` · ${t("expL")} ${f2(b.exp)}`:""}</small></div><div class="pv"><span class="num">${f2(b.net)}</span><small>${t("salesL")}</small></div><div class="pv"><b class="num ${b.np<0?"bad":"good"}">${f2(b.np)}</b><small class="num">${b.net?(b.gross/b.net*100).toFixed(1):"0.0"}%</small></div></div>`).join("")}</div>`:`<div class="empty">${t("noData")}</div>`}</div>`;
 $("rpp").onclick=e=>{const b=e.target.closest("button");if(!b)return;RP.p=b.dataset.k;repPro(box)};
 const cu=()=>{RP.p="c";RP.from=$("rp1").value||from;RP.to=$("rp2").value||to;if(RP.from>RP.to)[RP.from,RP.to]=[RP.to,RP.from];repPro(box)};$("rp1").onchange=cu;$("rp2").onchange=cu;
 $("rpx").onclick=()=>saveXlsx(t("profitRep")+"-"+from+"_"+to,t("tabPro"),[[t("periodL"),t("nTickets"),t("salesL"),t("retL"),t("cogsL"),t("grossL"),t("expL"),t("netL"),t("credGiven"),t("collected")],...D.rows.map(b=>[b.k,b.n,+b.rev.toFixed(2),+b.ret.toFixed(2),+(b.cost-b.retC).toFixed(2),+b.gross.toFixed(2),+b.exp.toFixed(2),+b.np.toFixed(2),+b.cred.toFixed(2),+b.col.toFixed(2)]),["Σ",T.n,+T.rev.toFixed(2),+T.ret.toFixed(2),+(T.cost-T.retC).toFixed(2),+T.gross.toFixed(2),+T.exp.toFixed(2),+T.np.toFixed(2),+T.cred.toFixed(2),+T.col.toFixed(2)]])}

 for(const sv of svcs){let chs=[];try{chs=await sv.getCharacteristics()}catch(e){continue}const c=chs.find(c=>c.properties.writeWithoutResponse||c.properties.write);if(c)return c}return null}
async function prnConnect(pick){if(!bleOk()){toast(t("prnNA"));return false}
 try{let dev=PRN.dev;if(!dev&&!pick&&navigator.bluetooth.getDevices){const ds=await navigator.bluetooth.getDevices();dev=ds.find(d=>d.name===S.prn.name)||null}
  if(!dev||pick)dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BLE_SVC});
  const ch=await prnFindChar(dev);if(!ch){toast(t("prnNoChar"));return false}
  PRN.dev=dev;PRN.ch=ch;S.prn.name=dev.name||"Printer";save();dev.addEventListener("gattserverdisconnected",()=>{PRN.ch=null});return true}
 catch(e){if(e&&e.name==="NotFoundError")return false;toast(t("prnFail"));return false}}
function escRaster(cv){const W=cv.width,H=cv.height,bw=Math.ceil(W/8);const d=cv.getContext("2d").getImageData(0,0,W,H).data;const out=[0x1b,0x40];const band=128;
 for(let y0=0;y0<H;y0+=band){const h=Math.min(band,H-y0);out.push(0x1d,0x76,0x30,0,bw&255,bw>>8,h&255,h>>8);
  for(let y=y0;y<y0+h;y++)for(let bx=0;bx<bw;bx++){let v=0;for(let k=0;k<8;k++){const x=bx*8+k;if(x<W){const i=(y*W+x)*4;const l=d[i]*.3+d[i+1]*.59+d[i+2]*.11;if(d[i+3]>40&&l<165)v|=128>>k}}out.push(v)}}
 out.push(0x1b,0x64,4);if(S.prn.cut)out.push(0x1d,0x56,0x42,0);return new Uint8Array(out)}
async function prnSend(bytes){const ch=PRN.ch;const nr=ch.properties.writeWithoutResponse&&ch.writeValueWithoutResponse;const n=nr?180:180;
 for(let i=0;i<bytes.length;i+=n){const part=bytes.slice(i,i+n);if(nr){await ch.writeValueWithoutResponse(part);await new Promise(r=>setTimeout(r,12))}else if(ch.writeValueWithResponse)await ch.writeValueWithResponse(part);else await ch.writeValue(part)}}
async function prnRows(R){if(!PRN.ch&&!(await prnConnect(false)))return false;toast(t("prnSending"));
 try{const cv=await drawRows(R);await prnSend(escRaster(cv));toast(t("prnDone"));return true}catch(e){PRN.ch=null;toast(t("prnFail"));return false}}
const printSale=s=>prnRows(rowsSale(s));
document.addEventListener("click",e=>{const b=e.target.closest("[data-prn]");if(!b)return;const s=S.sales.find(x=>x.id===+b.dataset.prn);if(s){b.disabled=true;printSale(s).finally(()=>{b.disabled=false})}});
function prnBox(){return `<div class="ssec prnbox"><b>${UI("receipt")} ${t("prnT")}</b>
 <div class="prnst ${S.prn.name&&PRN.ch?"ok":""}"><span class="dot"></span>${S.prn.name?`${esc(S.prn.name)} · ${PRN.ch?t("prnOk"):"…"}`:t("prnNone")}</div>
 <div class="row" style="flex-wrap:nowrap"><button class="pri" id="prc" style="flex:1">${UI("plus")} ${t("prnConn")}</button>${S.prn.name?`<button id="prt" style="flex:1">${t("prnTest")}</button>`:""}</div>
 <label class="tg"><input type="checkbox" id="pra" ${S.prn.auto?"checked":""}><span>${t("prnAuto")}</span></label>
 <label class="tg"><input type="checkbox" id="prk" ${S.prn.cut?"checked":""}><span>${t("prnCut")}</span></label>
 <p class="note" style="margin:4px 0 0">${t("prnHelp")}</p></div>`}
function prnWire(redraw){$("prc").onclick=async()=>{if(await prnConnect(true)){toast(t("prnOk"));redraw()}};
 if($("prt"))$("prt").onclick=()=>{const last=S.sales.filter(x=>x.pay!=="debt").at(-1);prnRows(last?rowsSale(last):(()=>{const R=[];tkHeadRows(R);R.push({c:t("prnTest"),sz:26,b:1},{c:new Date().toLocaleString("fr-MA"),sz:19,n:1},{c:(S.tkc&&S.tkc.paper==58?"58":"80")+" mm",sz:22,n:1});tkFootRows(R);return R})()).then(redraw)};
 $("pra").onchange=e=>{S.prn.auto=e.target.checked?1:0;save()};$("prk").onchange=e=>{S.prn.cut=e.target.checked?1:0;save()}}

/* ---- v29: install ping (count shops & devices) ---- */
const APPV="web-v31";
const pingSt=(ok,err)=>{try{localStorage.setItem("pos-ping-st",JSON.stringify({t:Date.now(),ok,err:err||""}))}catch(e){}};
async function ping(force){if(S.needOnb||!S.acctId)return;const U=PC.supabaseUrl||CLD.url,K=PC.supabaseKey||CLD.key;if(!U||!K){pingSt(false,t("pingNoCfg"));return}if(!navigator.onLine){pingSt(false,t("pingOff"));return}try{const last=+localStorage.getItem("pos-ping")||0;if(!force&&Date.now()-last<12*36e5)return;
 const d30=Date.now()-30*864e5;const p={acct:S.acctId,dev:DEV,name:S.shop.name||"",city:S.shop.city||"",phone:S.shop.phone||"",btype:S.btype||"",plan:planNow(),until:String((S.plan||{}).until||""),
  products:String(S.products.length),sales30:String(S.sales.filter(x=>x.t>d30&&x.pay!=="debt").length),users:String(S.users.filter(u=>u.active).length),lang:S.lang,ver:APPV,ua:navigator.userAgent.slice(0,200)};
 const h={"Content-Type":"application/json",apikey:K};if(/^eyJ/.test(K))h.Authorization="Bearer "+K;const r=await fetch(U.replace(/\/+$/,"")+"/rest/v1/rpc/pos_ping",{method:"POST",headers:h,body:JSON.stringify({p})});if(!r.ok){let m="HTTP "+r.status;try{const j=await r.json();m=j.message||j.hint||m}catch(_){}throw new Error(m)}localStorage.setItem("pos-ping",String(Date.now()));pingSt(true)}catch(e){pingSt(false,String(e&&e.message||e).slice(0,140))}}
function pingLine(){let st=null;try{st=JSON.parse(localStorage.getItem("pos-ping-st"))}catch(e){}
 return `<div class="pingl ${st?st.ok?"ok":"bad":""}"><span class="dot"></span><span>${t("pingL")}: ${st?(st.ok?t("pingOk"):t("pingErr")+" — "+esc(st.err))+` · <span class="num">${new Date(st.t).toLocaleString("fr-MA")}</span>`:t("pingNo")}</span><button id="pingb" class="xbtn">${t("pingNow")}</button></div><p class="note num" style="margin:2px 0 0">${t("acctNo")}: ${esc(S.acctId)} · ${esc(DEV)} · ${APPV}</p>`}
document.addEventListener("click",async e=>{const b=e.target.closest("#pingb");if(!b)return;b.disabled=true;await ping(true);const box=b.closest(".pingw");if(box)box.innerHTML=pingLine();else b.disabled=false});
setTimeout(()=>ping(false),4000);addEventListener("online",()=>ping(false));
/* ---- sheet ---- */
function sheet(h){$("sheet").innerHTML=h;$("sheet").classList.add("on");$("scrim").classList.add("on")}
function closeSheet(){$("sheet").classList.remove("on");$("scrim").classList.remove("on")}
$("scrim").onclick=closeSheet;addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
$("lang").onclick=()=>{S.lang=S.lang==="ar"?"fr":"ar";save();render()};
try{if(S&&S.palV!==2){S.pal="sky";S.palV=2;localStorage.setItem("pos-demo",JSON.stringify(S))}}catch(e){}
const PALS={sky:["#2a86c7","#1f7fc0","#dcedfa","#eef6fc"],teal:["#1b5f59","#1f6f68","#dcebe7","#eef1ed"],blue:["#294f70","#2f6690","#dde7f1","#eef1f5"],indigo:["#33397a","#434a9c","#e1e3f4","#f0f1f7"],plum:["#5c2f55","#74406c","#efe0eb","#f6f0f4"],terra:["#7a3e26","#9a5232","#f3e2d8","#f7f1ec"],sand:["#4b5b2f","#566a35","#e5e9d6","#f2f0e8"],slate:["#2b3138","#3f4954","#e2e5e9","#f1f2f4"]};
function applyPal(){document.documentElement.dataset.pal=S.pal||"sky";const md=S.mode||"light";if(md==="system")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=md;const mc=document.querySelector('meta[name=theme-color]');if(mc)mc.content=PALS[S.pal||"sky"][0]}
$("set").onclick=()=>needPerm("settings",openSet);function openSet(){sheet(`<h3>${t("settings")} <button id="x">${t("close")}</button></h3>
 <label>${t("palette")}</label>${Object.keys(PALS).map(k=>`<button class="swatch ${(S.pal||"sky")===k?"on":""}" data-pal="${k}"><i>${PALS[k].map(c=>`<b style="background:${c}"></b>`).join("")}</i>${t("pal_"+k)}</button>`).join("")}
 <label>${t("modeLbl")}</label><div class="seg" id="smd">${["light","dark","system"].map(k=>`<button data-k="${k}" class="${(S.mode||"light")===k?"on":""}">${t("mode_"+k)}</button>`).join("")}</div>
 <p class="note">${t("palNote")}</p>
 <label>${t("shopInfo")}</label><button id="shi" style="width:100%;text-align:start">${UI("receipt")} ${t("acctT")} — ${esc(shopName())}</button><button id="stks" style="width:100%;text-align:start;margin-top:6px">${UI("doc")} ${t("tkSet")}</button>
 <label>${t("mgmt")}</label><div class="setgrid"><button id="sstaff">${t("staff")}</button><button id="saud">${t("auditT")}</button><button id="stl">${t("taxLoy")}</button></div>
 <label>${t("lang")}</label><div class="seg" id="sl"><button data-k="ar" class="${S.lang==="ar"?"on":""}">العربية</button><button data-k="fr" class="${S.lang==="fr"?"on":""}">Français</button></div>`);
 $("x").onclick=closeSheet;$("stks").onclick=()=>tkSetSheet(openSet);$("shi").onclick=()=>shopInfoSheet(openSet);$("sstaff").onclick=()=>needPerm("staff",staffSheet);$("saud").onclick=auditSheet;$("stl").onclick=()=>taxLoySheet(openSet);
 $("sheet").querySelectorAll("[data-pal]").forEach(b=>b.onclick=()=>{S.pal=b.dataset.pal;save();applyPal();openSet()});
 $("sl").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.lang=b.dataset.k;save();render();openSet()};
 $("smd").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.mode=b.dataset.k;save();applyPal();openSet()}};
const fromHash=()=>{const h=location.hash.slice(1);if(["sale","buy","stock","cust","rep"].includes(h))view=h};
addEventListener("hashchange",()=>{fromHash();render()});
$("mnu").onclick=openMenu;
$("usr").onclick=()=>{audit("logout",cur()?.name||"");S.cur=null;GRANT=null;save();showLock()};
applyPal();fromHash();save();render();flush();if(S.needOnb)showOnb();else{if(!cur())showLock();planCheck()}
}
